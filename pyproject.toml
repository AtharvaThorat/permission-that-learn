[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grids-evaluation"
version = "0.1.0"
description = "Permissions That Learn experiment orchestration"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.12,<3", "httpx>=0.28,<1", "PyYAML>=6,<7"]

[project.scripts]
experiment = "experiment.__main__:main"

[tool.setuptools.packages.find]
include = ["experiment*", "blackbox*", "gatekeeper*", "integrations*"]

[tool.setuptools.package-data]
gatekeeper = ["model_manifest.json"]
