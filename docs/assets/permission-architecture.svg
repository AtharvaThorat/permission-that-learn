<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 930" role="img" aria-labelledby="title desc"><title id="title">Permission pipeline and bounded learning</title><desc id="desc">Actor proposals pass the Wall and Laya. BLOCK stops dispatch. ASK requires approval or eligible grant reuse. All allowed paths recheck exact action before tools execute. Reviewed feedback updates per-user learning, never the Wall.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#68716d"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#20262b}.name{font-size:19px;font-weight:650}.detail{font-size:14px}.label{font-size:13px;font-weight:650;fill:#68716d}.edge{fill:none;stroke:#68716d;stroke-width:1.8;marker-end:url(#arrow)}.feedback{stroke-dasharray:6 5}</style><rect x="330" y="20" width="340" height="72" rx="9" fill="#fff" stroke="#ccc6bd"/><text class="name" x="500.0" y="49" text-anchor="middle">Authentic request + actor</text><text class="detail" x="500.0" y="73" text-anchor="middle">Propose tool and exact arguments</text><rect x="330" y="135" width="340" height="72" rx="9" fill="#fff" stroke="#ccc6bd"/><text class="name" x="500.0" y="164" text-anchor="middle">Bind action &amp; trusted context</text><text class="detail" x="500.0" y="188" text-anchor="middle">Identity · resources · policy · schema</text><rect x="330" y="250" width="340" height="72" rx="9" fill="#f0ece5" stroke="#ccc6bd"/><text class="name" x="500.0" y="279" text-anchor="middle">Deterministic Wall</text><text class="detail" x="500.0" y="303" text-anchor="middle">Fixed permission boundary</text><rect x="330" y="365" width="340" height="72" rx="9" fill="#f0ece5" stroke="#ccc6bd"/><text class="name" x="500.0" y="394" text-anchor="middle">Laya gatekeeper</text><text class="detail" x="500.0" y="418" text-anchor="middle">Raw ALLOW / ASK / BLOCK</text><rect x="20" y="350" width="240" height="85" rx="9" fill="#fae9e8" stroke="#a85b5b"/><text class="name" x="140.0" y="379" text-anchor="middle">Withhold action</text><text class="detail" x="140.0" y="403" text-anchor="middle">Denial or evaluation error</text><rect x="730" y="365" width="250" height="85" rx="9" fill="#faf1de" stroke="#b19c69"/><text class="name" x="855.0" y="394" text-anchor="middle">Resolve optional ASK</text><text class="detail" x="855.0" y="418" text-anchor="middle">User approval / eligible grant</text><rect x="730" y="530" width="250" height="85" rx="9" fill="#fff" stroke="#ccc6bd"/><text class="name" x="855.0" y="559" text-anchor="middle">Scoped permission store</text><text class="detail" x="855.0" y="583" text-anchor="middle">User · exact scope · expiry</text><rect x="730" y="665" width="250" height="85" rx="9" fill="#fff" stroke="#ccc6bd"/><text class="name" x="855.0" y="694" text-anchor="middle">Per-user learner</text><text class="detail" x="855.0" y="718" text-anchor="middle">Ask or use an existing grant</text><rect x="330" y="530" width="340" height="85" rx="9" fill="#eaf1ed" stroke="#6c8d7b"/><text class="name" x="500.0" y="559" text-anchor="middle">Exact-action recheck</text><text class="detail" x="500.0" y="583" text-anchor="middle">Wall · state · grant · replay protection</text><rect x="330" y="665" width="340" height="72" rx="9" fill="#eaf1ed" stroke="#6c8d7b"/><text class="name" x="500.0" y="694" text-anchor="middle">Dispatch simulated tools</text><text class="detail" x="500.0" y="718" text-anchor="middle">Execute only after valid authorization</text><rect x="330" y="800" width="340" height="72" rx="9" fill="#fff" stroke="#ccc6bd"/><text class="name" x="500.0" y="829" text-anchor="middle">Outcome &amp; reviewed feedback</text><text class="detail" x="500.0" y="853" text-anchor="middle">Audit trail and learning observations</text><path class="edge " d="M500 92V135"/><path class="edge " d="M500 207V250"/><path class="edge " d="M500 322V365"/><text class="label" x="512" y="348">PASS</text><path class="edge " d="M330 286H140V350"/><text class="label" x="170" y="275">DENY</text><path class="edge " d="M330 400H260"/><text class="label" x="266" y="389">BLOCK</text><path class="edge " d="M500 437V530"/><text class="label" x="510" y="482">ALLOW</text><path class="edge " d="M670 400H730"/><text class="label" x="680" y="388">ASK</text><path class="edge " d="M855 450V490H650V530"/><text class="label" x="673" y="480">Valid approval / permitted reuse</text><path class="edge " d="M855 530V490"/><text class="label" x="867" y="518">Grant match</text><path class="edge " d="M855 665V615"/><text class="label" x="867" y="643">Choice within grant</text><path class="edge feedback" d="M670 836H855V750"/><text class="label" x="704" y="823">Reviewed feedback only</text><path class="edge " d="M500 615V665"/><text class="label" x="510" y="646">Checks pass</text><path class="edge " d="M500 737V800"/><path class="edge " d="M330 570H140V435"/><text class="label" x="160" y="558">Invalid / stale</text><text class="detail" x="500" y="913" text-anchor="middle">Unresolved ASK stays pending. Rejection, expiry and revocation prevent reuse. Learning never overrides the Wall.</text></svg>